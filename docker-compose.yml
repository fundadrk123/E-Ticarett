services:
  postgres:
    image: postgres:16-alpine
    container_name: mertem-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mertem
      POSTGRES_PASSWORD: mertem123
      POSTGRES_DB: mertem_shop
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
